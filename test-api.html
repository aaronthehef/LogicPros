<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordPress API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .post {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .post h3 {
            margin-top: 0;
            color: #333;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        pre {
            background: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>WordPress API Test</h1>
    <p>This page tests the WordPress proxy API endpoint directly.</p>

    <button onclick="testAPI()">Test API</button>
    <button onclick="clearCache()">Clear Cache & Reload</button>

    <div id="status"></div>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');

            statusDiv.innerHTML = '<div class="status loading">Testing API...</div>';
            resultsDiv.innerHTML = '';

            try {
                // Add timestamp to bypass cache
                const timestamp = new Date().getTime();
                const url = `/api/wordpress-proxy?endpoint=${encodeURIComponent('/wp/v2/posts')}&per_page=5&_nocache=${timestamp}`;

                console.log('Fetching:', url);

                const response = await fetch(url, {
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 200)}`);
                }

                const data = await response.json();
                console.log('Response data:', data);

                statusDiv.innerHTML = `
                    <div class="status success">
                        ✓ API is working! Found ${data.length} posts
                        <br><small>HTTP Status: ${response.status}</small>
                    </div>
                `;

                // Display posts
                if (data.length > 0) {
                    resultsDiv.innerHTML = '<h2>Blog Posts:</h2>' +
                        data.map(post => `
                            <div class="post">
                                <h3>${post.title.rendered}</h3>
                                <p><strong>ID:</strong> ${post.id}</p>
                                <p><strong>Date:</strong> ${new Date(post.date).toLocaleString()}</p>
                                <p><strong>Slug:</strong> ${post.slug}</p>
                            </div>
                        `).join('');
                } else {
                    resultsDiv.innerHTML = '<p>No posts found.</p>';
                }

                // Show raw response
                resultsDiv.innerHTML += '<h2>Raw Response:</h2><pre>' +
                    JSON.stringify(data, null, 2).substring(0, 2000) +
                    (JSON.stringify(data).length > 2000 ? '\n...(truncated)' : '') +
                    '</pre>';

            } catch (error) {
                console.error('API Test Error:', error);
                statusDiv.innerHTML = `
                    <div class="status error">
                        ✗ API Error: ${error.message}
                    </div>
                `;
                resultsDiv.innerHTML = '<pre>' + error.stack + '</pre>';
            }
        }

        function clearCache() {
            // Clear service workers
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                });
            }

            // Clear cache storage
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => caches.delete(name));
                });
            }

            // Force reload without cache
            setTimeout(() => {
                window.location.reload(true);
            }, 500);
        }

        // Auto-run test on load
        window.addEventListener('load', () => {
            testAPI();
        });
    </script>
</body>
</html>
